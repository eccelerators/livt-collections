[project]
name = "Livt.Collections"
version = "1.4.2"
description = "Fixed-capacity FIFOs, queues, stacks, circular buffers, lists, and bit sets for Livt hardware."
authors = ["Denis Vasilík"]
repository = "https://github.com/eccelerators/livt-collections"
homepage = "https://github.com/eccelerators/livt-collections"
keywords = ["fpga", "collections", "fifo", "queue", "stack", "buffer"]
license = "MIT"
path = "src"
outdir = "out"

[publish]
files = ["README.md", "CHANGELOG.md", "LICENSE"]

[project.organization]
name = "Eccelerators GmbH"
website = "https://eccelerators.com"

[tests]
path = "tests"
components = [
    "AsyncFifoTest",
    "AsyncFifoStorageClockTest",
    "GenericCollectionsTest",
    "QueueInterfaceTest",
    "GenericQueueTest",
    "ConcurrentQueueTest",
    "QueueCapacityTest",
    "QueueClearConcurrencyTest",
    "ListIteratorTest",
    "Queue8Test",
    "Queue16Test",
    "Queue32Test",
    "Queue64Test",
    "Stack8Test",
    "Stack16Test",
    "Stack32Test",
    "Stack64Test",
    "CircularBufferTest",
    "ListTest",
    "BitSet8Test"
]

[build.debug]
warnings = ["all"]

[build.release]
warnings = ["all"]
